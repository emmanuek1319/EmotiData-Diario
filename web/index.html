<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmotiData · Diario Emocional Inteligente</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌤️%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#070d1a;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--txt:#e8eefc;--mut:#8fa0c4;--blue:#3b82f6;--blue2:#60a5fa;--or:#ff8a3d;--or2:#ffb067}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;color:var(--txt);background:radial-gradient(900px 500px at 10% -10%,rgba(59,130,246,.3),transparent 60%),radial-gradient(800px 500px at 100% 110%,rgba(255,138,61,.22),transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0 16px}
.logo{font-size:1.7rem;font-weight:800;background:linear-gradient(90deg,var(--blue2),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{position:fixed;top:12px;right:12px;z-index:5;font-size:.8rem;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(7,13,26,.85)}
.chip.ok{border-color:rgba(96,165,250,.6)}.chip.wait{border-color:rgba(255,138,61,.7)}.chip.bad{border-color:#ef4444}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
nav button,.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:9px 16px;border-radius:99px;cursor:pointer;font:inherit}
nav button.on{background:linear-gradient(90deg,var(--blue),#2563eb);border-color:transparent}
.btn{background:linear-gradient(90deg,var(--blue),var(--or));color:#fff;border:0;padding:12px 22px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
input,textarea{width:100%;background:rgba(0,0,0,.35);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit}
textarea{min-height:140px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
form{display:grid;gap:12px;margin-top:16px}
h2{margin-bottom:14px;font-size:1.2rem}
.mut,small{color:var(--mut)}
.err{color:#ff9b9b}
#login{max-width:420px;margin:12vh auto 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:1.3rem;margin-bottom:4px}
.reply{display:flex;gap:14px;align-items:center;margin-top:16px;padding:16px;border-radius:14px;border:1px solid rgba(255,138,61,.4);background:rgba(255,138,61,.08)}
.big{font-size:2.4rem}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.em{font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.medal{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:14px;border:1px solid rgba(96,165,250,.4);background:rgba(59,130,246,.1)}
.medal span{font-size:1.8rem}
.medal.lock{opacity:.45;filter:grayscale(1);border-color:var(--line)}
.next{color:var(--or2)}
#frase{min-height:110px;font-size:1.25rem;line-height:1.5;text-align:center}
#frase small{display:block;margin-top:8px;font-size:.95rem}
.resp{width:150px;height:150px;margin:22px auto;border-radius:50%;display:grid;place-items:center;font-weight:700;background:radial-gradient(circle,rgba(96,165,250,.55),rgba(59,130,246,.15));box-shadow:0 0 60px rgba(59,130,246,.5);animation:resp 8s ease-in-out infinite}
@keyframes resp{0%,100%{transform:scale(.7)}50%{transform:scale(1.1)}}
.skel{height:70px;border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
svg{width:100%;height:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<span id="estado" class="chip wait">⏳ Despertando servidor…</span>

<main id="login" class="card" hidden>
  <div class="logo">EmotiData</div>
  <p class="mut">Tu diario emocional inteligente</p>
  <form id="fLogin">
    <label for="usuario" class="mut">Correo, matrícula o ID</label>
    <input id="usuario" autocomplete="username" required>
    <button class="btn" id="bLogin">Entrar</button>
    <p id="lerr" class="err" role="alert"></p>
  </form>
</main>

<div id="app" class="wrap" hidden>
  <header>
    <div class="logo">EmotiData</div>
    <div><span id="quien" class="mut"></span> <button class="ghost" id="salir">Salir</button></div>
  </header>
  <nav>
    <button data-v="inicio">🏠 Inicio</button>
    <button data-v="registrar">✍️ Registrar</button>
    <button data-v="historial">📈 Historial</button>
    <button data-v="logros">🏅 Logros</button>
    <button data-v="relax">🧘 Relax</button>
  </nav>

  <section class="view card" id="v-inicio">
    <h2>👋 Hola, <span id="nom"></span></h2>
    <div class="stats" id="resumen"></div>
  </section>

  <section class="view card" id="v-registrar" hidden>
    <h2>¿Cómo te sientes hoy?</h2>
    <form id="fReg">
      <textarea id="texto" maxlength="1000" placeholder="Escribe lo que piensas o sientes…" required></textarea>
      <button class="btn" id="bReg">Guardar entrada</button>
    </form>
    <div id="regOut"></div>
  </section>

  <section class="view card" id="v-historial" hidden>
    <h2>Tu evolución emocional</h2>
    <div id="grafica"></div>
    <div id="lista"></div>
  </section>

  <section class="view card" id="v-logros" hidden>
    <h2>Tus logros</h2>
    <div id="logros"></div>
  </section>

  <section class="view card" id="v-relax" hidden>
    <h2>Zona Relax</h2>
    <div class="resp" id="resp">Inhala</div>
    <div id="frase"></div>
    <p style="text-align:center;margin-top:12px"><button class="ghost" id="otra">Otra frase ➜</button></p>
  </section>
</div>

<script>
/* ===== CONFIG: única línea que cambia entre entornos ===== */
const API_BASE = "https://emotidata-backend.onrender.com";

const EMO = {"Alegría":"😊","Tristeza":"😢","Miedo / Ansiedad":"😰","Enojo":"😠","Neutral":"😐"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let session = null, frases = [], fi = 0;
try { session = JSON.parse(sessionStorage.getItem("emoti") || "null"); } catch (e) {}

async function api(path, body) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 100000);
  const h = {};
  if (body) h["Content-Type"] = "application/json";
  if (session && session.token) h.Authorization = "Bearer " + session.token; /* listo para JWT (paso 4) */
  try {
    const r = await fetch(API_BASE + path, { method: body ? "POST" : "GET", headers: h, body: body ? JSON.stringify(body) : undefined, signal: ctrl.signal });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Error " + r.status);
    return d;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("El servidor tardó demasiado. Intenta de nuevo.");
    if (e instanceof TypeError) throw new Error("No se pudo conectar con el servidor (revisa CORS_ORIGINS en Render).");
    throw e;
  } finally { clearTimeout(t); }
}

/* Despierta el servidor de Render (plan gratuito) y precarga las frases */
async function despertar() {
  const s = $("#estado");
  s.textContent = "⏳ Despertando servidor…"; s.className = "chip wait";
  try {
    frases = (await api("/api/relax/frases")).frases || [];
    s.textContent = "🟢 Servidor listo"; s.className = "chip ok";
  } catch (e) { s.textContent = "🔴 Sin conexión"; s.className = "chip bad"; s.title = e.message; }
}

function guardar() { try { sessionStorage.setItem("emoti", JSON.stringify(session)); } catch (e) {} }

function entrar() {
  $("#login").hidden = true; $("#app").hidden = false;
  $("#nom").textContent = session.nombre; $("#quien").textContent = session.nombre;
  show("inicio");
}
function salir() {
  session = null; try { sessionStorage.removeItem("emoti"); } catch (e) {}
  $("#app").hidden = true; $("#login").hidden = false; $("#usuario").value = "";
}

const vistas = { inicio: cargarInicio, registrar: () => {}, historial: cargarHistorial, logros: cargarLogros, relax: cargarRelax };
function show(v) {
  document.querySelectorAll(".view").forEach(x => x.hidden = x.id !== "v-" + v);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  vistas[v]();
}

/* ---------- Login ---------- */
$("#fLogin").onsubmit = async e => {
  e.preventDefault();
  const u = $("#usuario").value.trim(); if (!u) return;
  const b = $("#bLogin"); b.disabled = true; b.textContent = "Entrando…"; $("#lerr").textContent = "";
  try {
    const d = await api("/api/login", { usuario: u }); /* TODO paso 4: contraseña + token */
    const rol = d.rol || d.Rol || "estudiante";
    if (rol === "psicologa") throw new Error("El panel de la psicóloga se habilitará junto con la seguridad. Por ahora usa la app de escritorio.");
    session = { id: d.id || d.usuario_id, nombre: d.nombre || d.nombre_completo || "Usuario", rol, token: d.token };
    guardar(); entrar();
  } catch (err) { $("#lerr").textContent = err.message; }
  b.disabled = false; b.textContent = "Entrar";
};

/* ---------- Inicio ---------- */
async function cargarInicio() {
  const box = $("#resumen"); box.innerHTML = '<div class="skel"></div>';
  try {
    const d = await api("/api/usuario/resumen/" + encodeURIComponent(session.id));
    box.innerHTML = `
      <div class="stat"><b>🔥 ${esc(d.racha_dias)}</b><span class="mut">días de racha</span></div>
      <div class="stat"><b>${EMO[d.ultima_emocion] || "🙂"} ${esc(d.ultima_emocion)}</b><span class="mut">última emoción</span></div>
      <div class="stat"><b>📅 ${esc(String(d.fecha_ultima).slice(0, 10))}</b><span class="mut">último registro</span></div>`;
  } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

/* ---------- Registrar ---------- */
$("#fReg").onsubmit = async e => {
  e.preventDefault();
  const texto = $("#texto").value.trim(); if (!texto) return;
  const b = $("#bReg"), out = $("#regOut"); b.disabled = true; b.textContent = "Guardando…";
  try {
    const d = await api("/api/diario/registrar", { usuario_id: session.id, texto });
    out.innerHTML = `<div class="reply"><div class="big">${EMO[d.emocion] || "🙂"}</div><div><b>${esc(d.emocion)}</b><p>${esc(d.mensaje_empatico)}</p></div></div>`;
    $("#texto").value = "";
  } catch (err) { out.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
  b.disabled = false; b.textContent = "Guardar entrada";
};

/* ---------- Historial + gráfica SVG ---------- */
async function cargarHistorial() {
  const lista = $("#lista"); lista.innerHTML = '<div class="skel"></div>'; $("#grafica").innerHTML = "";
  try {
    const es = (await api("/api/diario/historial/" + encodeURIComponent(session.id))).entradas || [];
    if (!es.length) { lista.innerHTML = '<p class="mut">Aún no hay entradas.</p>'; return; }
    dibujar(es.slice(0, 30).reverse());
    lista.innerHTML = es.map(x => `<div class="item"><span class="em">${EMO[x.emocion] || "🙂"}</span><div><small>${esc(x.fecha)} · ${esc(x.emocion)}</small><p>${esc(x.texto_original)}</p></div></div>`).join("");
  } catch (e) { lista.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
function dibujar(es) {
  const W = 600, H = 200, p = 24, n = es.length;
  const X = i => p + (n === 1 ? (W - 2 * p) / 2 : i * (W - 2 * p) / (n - 1));
  const Y = v => p + (1 - v) / 2 * (H - 2 * p);
  const pts = es.map((x, i) => { const v = +x.puntuacion || 0; return [X(i), Y(v), v]; });
  $("#grafica").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de tu estado emocional">
    <defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs>
    <line x1="${p}" x2="${W - p}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="4 4"/>
    <text x="${p}" y="14" fill="#8fa0c4" font-size="11">Positivo</text>
    <text x="${p}" y="${H - 6}" fill="#8fa0c4" font-size="11">Negativo</text>
    <polyline points="${pts.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ")}" fill="none" stroke="url(#gr)" stroke-width="3" stroke-linejoin="round"/>
    ${pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="${q[2] > 0 ? "#60a5fa" : q[2] < 0 ? "#ff8a3d" : "#8fa0c4"}"/>`).join("")}</svg>`;
}

/* ---------- Logros ---------- */
async function cargarLogros() {
  const box = $("#logros"); box.innerHTML = '<div class="skel"></div>';
  try {
    const d = await api("/api/usuario/logros/" + encodeURIComponent(session.id));
    box.innerHTML = `<p class="mut">🔥 Racha: ${esc(d.racha_actual)} días · ${esc(d.desbloqueados_conteo)}/${esc(d.total_logros)} logros</p>
      <div class="grid">${(d.logros || []).map(l => `<div class="medal ${l.desbloqueado ? "" : "lock"}"><span>${esc(l.icono)}</span><b>${esc(l.titulo)}</b><small>${esc(l.descripcion)}</small></div>`).join("")}</div>
      <p class="next">${esc(d.proximo_logro && d.proximo_logro.leyenda)}</p>`;
  } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

/* ---------- Relax ---------- */
async function cargarRelax() {
  if (!frases.length) { try { frases = (await api("/api/relax/frases")).frases || []; } catch (e) {} }
  mostrarFrase();
}
function mostrarFrase() {
  const f = frases.length ? frases[fi % frases.length] : null;
  $("#frase").innerHTML = f ? `<p>“${esc(f.texto)}”</p><small>— ${esc(f.autor)}</small>` : "<p>Respira profundo…</p>";
}
$("#otra").onclick = () => { fi++; mostrarFrase(); };
let inh = true;
setInterval(() => { $("#resp").textContent = (inh = !inh) ? "Inhala" : "Exhala"; }, 4000);

/* ---------- Arranque ---------- */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.v));
$("#salir").onclick = salir;
despertar();
if (session && session.id) entrar(); else $("#login").hidden = false;
</script>
</body>
</html>
